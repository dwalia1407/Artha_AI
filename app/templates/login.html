{% extends "base.html" %}{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>
<form method="post" class="card" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required value="{{ form.get('email', '') }}">
  <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
  <p><button type="submit">Sign in</button></p>
</form>
<p>New here? <a href="{{ url_for('web.register') }}">Create an account</a></p>
{% endblock %}
