{% extends "base.html" %}{% block title %}Create account{% endblock %}
{% block content %}
<h1>Create your account</h1>
<form method="post" class="card" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="display_name">Your name</label><input id="display_name" name="display_name" type="text" required value="{{ form.get('display_name', '') }}">
  <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required value="{{ form.get('email', '') }}">
  <label for="password">Password (at least 10 characters)</label><input id="password" name="password" type="password" autocomplete="new-password" required minlength="10">
  <p><button type="submit">Create account</button></p>
</form>
<p>Already registered? <a href="{{ url_for('web.login') }}">Sign in</a></p>
{% endblock %}
