<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Artha AI{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
<script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
<header class="top"><div class="bar">
  <a class="brand" href="{{ url_for('web.index') }}">Artha AI</a>
  {% if me %}
  <nav aria-label="Main">
    <a href="{{ url_for('web.dashboard') }}">Households</a>
    <a href="{{ url_for('web.profile') }}">Profile</a>
  </nav>
  <span class="muted">{{ me.display_name }}</span>
  <form method="post" action="{{ url_for('web.logout') }}" class="inline">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit" class="secondary">Sign out</button>
  </form>
  {% endif %}
</div></header>
<main>
{% with messages = get_flashed_messages(with_categories=true) %}
  {% for category, message in messages %}<div class="flash {{ category }}" role="{{ 'alert' if category == 'error' else 'status' }}">{{ message }}</div>{% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</main>
</body>
</html>
