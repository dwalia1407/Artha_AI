{% extends "base.html" %}{% block title %}Profile{% endblock %}
{% block content %}
<h1>Your profile</h1>
<form method="post" class="card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="email">Email</label><input id="email" type="email" value="{{ me.email }}" disabled>
  <p class="muted">{% if me.email_verified_at %}Verified{% else %}Not verified{% endif %}</p>
  <label for="display_name">Display name</label><input id="display_name" name="display_name" type="text" required maxlength="120" value="{{ me.display_name }}">
  <p><button type="submit">Save</button></p>
</form>
{% endblock %}
